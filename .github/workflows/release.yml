name: Release

# Vydání verze: tag vX.Y.Z = VERSION = sekce "## [X.Y.Z]" v CHANGELOG.md.
# Vznikne GitHub Release s binárkami pro šest cílů, SHA256SUMS a souhrnnou
# větou z changelogu. Z releasu čte info kanál Miládky
# (miladka.cz/moduly.json) verzi a změny. Pravidla: CLAUDE.md, Vydání verze.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verze a popis změn
        run: |
          VERZE="${TAG#v}"
          if [ "$(tr -d '[:space:]' < VERSION)" != "$VERZE" ]; then
            echo "VERSION má $(cat VERSION), tag je $VERZE" >&2
            exit 1
          fi
          awk -v v="$VERZE" '
            index($0, "## [" v "]") == 1 { uvnitr = 1; next }
            uvnitr && index($0, "## [") == 1 { exit }
            uvnitr { print }
          ' CHANGELOG.md > sekce.md
          SOUHRN=$(grep -m1 -v '^[[:space:]]*$' sekce.md || true)
          if [ -z "$SOUHRN" ]; then
            echo "CHANGELOG.md nemá sekci ## [$VERZE] se souhrnnou větou" >&2
            exit 1
          fi
          # Kontrolní seznam vydání (CLAUDE.md): každá verze říká, co má
          # Miládka při aktualizaci udělat - i kdyby to bylo "nic".
          if ! grep -q '^### Při aktualizaci' sekce.md; then
            echo "Sekce ## [$VERZE] v CHANGELOG.md nemá podsekci '### Při aktualizaci' (když není potřeba nic: 'Nastavení se nemění.')" >&2
            exit 1
          fi
          printf '%s\n\nPodrobně v [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n' \
            "$SOUHRN" "$GITHUB_REPOSITORY" "$TAG" > zmeny.md

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.release=yes" \
              -o "dist/mcp-whatsapp-$os-$arch$ext" ./cmd/mcp-whatsapp
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: zmeny.md
          files: dist/*

  # Po vydání ověří, že verzi hlásí info kanál Miládky (miladka.cz/moduly.json
  # drží data 10 minut). Když ne - chybí záznam v MODULY na webu, nebo se
  # release nenačetl - založí issue, ať se to nedozví až uživatel.
  info-kanal:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Verze v info kanálu
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERZE="${TAG#v}"
          for i in $(seq 1 20); do
            if curl -s https://miladka.cz/moduly.json | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if any(m['id']=='whatsapp' and m['verze']=='$VERZE' for m in d['moduly']) else 1)"; then
              echo "Info kanál hlásí whatsapp $VERZE."
              exit 0
            fi
            sleep 60
          done
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Info kanál nehlásí verzi $VERZE" \
            --body "miladka.cz/moduly.json ani 20 minut po vydání neukazuje modul whatsapp ve verzi $VERZE. Zkontroluj záznam v MODULY (web-miladka, src/lib/moduly.ts) a release. Dokud to nejde, Miládka u uživatelů o nové verzi neví."
          exit 1
